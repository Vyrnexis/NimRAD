name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly: catch nimvcl main breaking the IDE early

jobs:
  linux:
    name: linux (nimvcl ${{ matrix.nimvcl }})
    runs-on: ubuntu-latest
    container: archlinux:latest
    strategy:
      fail-fast: false
      matrix:
        # the released version the IDE depends on, and nimvcl's main branch
        nimvcl: [v0.1.1, main]
    continue-on-error: ${{ matrix.nimvcl == 'main' }}
    env:
      SDL_VIDEO_DRIVER: offscreen
      SDL_RENDER_DRIVER: software
    steps:
      - name: Install toolchain and SDL3
        run: |
          pacman -Syu --noconfirm --needed git gcc nim nimble sdl3 sdl3_ttf sdl3_image noto-fonts
      - uses: actions/checkout@v5
        with:
          path: nimvcl-ide
      - name: Get nimvcl
        # A sibling checkout is picked up by config.nims.
        run: git clone --depth 1 --branch ${{ matrix.nimvcl }} https://github.com/Vyrnexis/nimvcl.git nimvcl
      - name: Install dependencies
        working-directory: nimvcl
        run: nimble install -d -y
      - name: Build
        working-directory: nimvcl-ide
        run: nimble build -y
      - name: Test
        working-directory: nimvcl-ide
        run: bash scripts/test.sh
